<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>

  <link rel="icon" type="image/x-icon" href="./assets/img/favicon/F5-favicon-100x100.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="./assets/css/grid.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="stylesheet" href="./assets/css/cart.css">
</head>

<body>

  <h2 class="cart-heading">Giỏ hàng</h2>
  <div class="grid wide">
    <div class="row">
      <div class="col l-6 m-6 c-12">
        <div class="cart__container">
          <div class="cart__empty">
            <p class="cart__empty-text">Chưa có sản phẩm nào trong giỏ hàng</p>
          </div>
          <div class="cart__content">
            <div class="cart__header">

            </div>

            <div class="cart__list">
              <div class="cart__item">
                <div class="cart-item__thumbnail">
                  <a href="" class="cart-item__thumbnail-link">
                    <img src="./assets/img/product/goods-2.jpg" alt="">
                  </a>
                </div>
                <div class="cart-item__info">
                  <p class="cart-item__title">T-Shirt Care & Share Đam mê test test test</p>
                  <p class="cart-item__color-size-text">Xanh Mosaic/XL</p>
                  <div class="cart-item__actions">
                    <div class="cart-item__color">
                      <select name="color" id="cart-item__color-dropdown">
                        <option value="Xanh Mosaic">Xanh Mosaic</option>
                        <option value="Trang">Trang White</option>
                        <option value="Den">Den Black</option>
                      </select>
                    </div>
                    <div class="cart-item__size">
                      <select name="size" id="cart-item__size-dropdown">
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="L">XL</option>
                      </select>
                    </div>
                    <div class="cart-item__quantity">
                      <span class="cart-item__minus-btn">-</span>
                      <input type="text" class="cart-item_quantity-input" value="10">
                      <span class="cart-item__plus-btn">+</span>
                    </div>
                  </div>
                  <div class="cart-item__price">
                    <span class="cart-item__sale-price">189.000đ</span>
                    <del class="cart-item__original-price">259.000đ</del>
                  </div>
                </div>
                <div class="cart-item__remove">
                  <i class="fa-solid fa-trash"></i>
                </div>
              </div>
            </div>
          </div>
          <!-- <div class="cart__footer">
            <div class="cart__subtotal-wrap">
              <span class="subtotal__title">Tổng tiền:</span>
              <span class="subtotal">936.000₫</span>
            </div>
            <div class="cart__btn">
              <a href="#" class="cart__checkout btn">Thanh Toán</a>
            </div>
          </div> -->
        </div>
      </div>
    </div>
  </div>
  </div>


</body>

</html>
