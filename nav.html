<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar with BEM</title>
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar__toggle">&#9776;</div>
        <div class="navbar__logo">YourLogo</div>
        <ul class="navbar__menu">
            <li class="navbar__item"><a href="#" class="navbar__link">Home</a></li>
            <li class="navbar__item navbar__item--dropdown">
                <a href="#" class="navbar__link">Products</a>
                <ul class="navbar__submenu">
                    <li class="navbar__submenu-item"><a href="#" class="navbar__submenu-link">Submenu 1</a></li>
                    <li class="navbar__submenu-item"><a href="#" class="navbar__submenu-link">Submenu 2</a></li>
                </ul>
            </li>
            <li class="navbar__item navbar__item--dropdown">
                <a href="#" class="navbar__link">Categories</a>
                <ul class="navbar__submenu">
                    <li class="navbar__submenu-item"><a href="#" class="navbar__submenu-link">Submenu 1</a></li>
                    <li class="navbar__submenu-item"><a href="#" class="navbar__submenu-link">Submenu 2</a></li>
                </ul>
            </li>
        </ul>
        <div class="navbar__icons">
            <a href="#" class="navbar__icon"><i class="fas fa-shopping-cart"></i></a>
            <a href="#" class="navbar__icon"><i class="fas fa-user"></i></a>
        </div>
    </nav>

    <!-- Content Section for Scroll -->
    <div class="content">
        <p>Content goes here...</p>
        <!-- Repeat or add more content as needed -->
    </div>

    <!-- Go to Top Button -->
    <button id="goTopBtn" class="go-top-btn"><i class="fas fa-arrow-up"></i></button>

    <script src="nav.js"></script>
</body>
</html>
